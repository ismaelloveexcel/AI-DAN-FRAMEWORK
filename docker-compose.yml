version: '3.8'

services:
  api:
    build: .
    container_name: aidan-os-api
    ports:
      - "8000:8000"
    environment:
      # OPENAI_API_KEY: set to your real key for live responses.
      # If placeholder is left, the server runs in mock mode (responses are stubs).
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your-openai-key-here}
      - AIRTABLE_API_KEY=${AIRTABLE_API_KEY:-}
      - AIRTABLE_BASE_ID=${AIRTABLE_BASE_ID:-}
      - FRAMEWORK_API_KEY=${FRAMEWORK_API_KEY:-dev-key}
      - ENABLE_AUTH=${ENABLE_AUTH:-false}
      - PYTHONUNBUFFERED=1
    networks:
      - aidan-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  aidan-network:
    driver: bridge
